<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<style>

body{
    font-family:Arial;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:40px;
    border-radius:20px;
    width:350px;
}

h2{
    text-align:center;
    color:#5a5adb;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#5a5adb;
    color:white;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}
/* Mobile Responsive */

@media screen and (max-width: 768px){

body{
padding:10px;
}

.navbar{
padding:15px;
flex-direction:column;
gap:10px;
}

.logo{
font-size:24px;
text-align:center;
}

.route-box,
.ticket,
.payment-box,
.info{
width:100%;
padding:20px;
}

h1{
font-size:28px;
}

h2{
font-size:22px;
}

button{
width:100%;
font-size:16px;
}

input,
select{
width:100%;
}

}

/* Small Phones */

@media screen and (max-width:480px){

h1{
font-size:22px;
}

.logo{
font-size:20px;
}

button{
padding:12px;
}

}

@media(max-width:768px){

.login-box,
.signup-box,
.forgot-box{
width:95%;
padding:20px;
}

input{
font-size:16px;
}

button{
width:100%;
}

}

</style>

</head>

<body>

<div class="box">

<h2>Forgot Password</h2>

<input type="email" id="email" placeholder="Enter Email">

<button onclick="resetPassword()">
Send Reset Link
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
getAuth,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyBZMZ7gB91oOKMF2PywsJHj_Sr4AsThZm4",

authDomain: "srisaradhabus.firebaseapp.com",

projectId: "srisaradhabus",

storageBucket: "srisaradhabus.firebasestorage.app",

messagingSenderId: "1068667302044",

appId: "1:1068667302044:web:972971c838a8fdbd9a7d59",

measurementId: "G-X5WZVD38XS"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.resetPassword = function(){

let email=document.getElementById("email").value;

sendPasswordResetEmail(auth,email)

.then(()=>{

alert("Password Reset Email Sent!");

})

.catch((error)=>{

alert(error.message);

});

}

</script>

</body>
</html>
