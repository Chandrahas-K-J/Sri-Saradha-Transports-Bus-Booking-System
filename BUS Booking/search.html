<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search Buses</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f3f4f9;
}

/* NAVBAR */

.navbar{
background:#071633;
padding:20px 50px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.logo{
font-size:42px;
font-weight:bold;
color:#28a8ff;
}

.back-btn{
background:#7b3ff2;
color:white;
padding:12px 25px;
border-radius:12px;
text-decoration:none;
font-size:22px;
}

/* TOP CARD */

.route-box{
width:90%;
margin:40px auto;
background:white;
border-radius:30px;
padding:40px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.route-box h1{
font-size:55px;
color:#071633;
margin-bottom:20px;
}

.route-box h2{
font-size:40px;
color:#071633;
}

/* BUS LIST */

.bus-container{
width:90%;
margin:auto;
display:flex;
flex-direction:column;
gap:30px;
padding-bottom:50px;
}

.bus-card{
background:white;
border-radius:30px;
padding:40px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
transition:0.3s;
}

.bus-card:hover{
transform:translateY(-5px);
}

.bus-name{
font-size:45px;
font-weight:bold;
color:#071633;
margin-bottom:15px;
}

.bus-type{
font-size:28px;
color:#7b3ff2;
margin-bottom:25px;
}

.rating{
background:#18c37e;
color:white;
display:inline-block;
padding:12px 20px;
border-radius:15px;
font-size:24px;
margin-bottom:30px;
}

.time-row{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:20px;
margin-bottom:30px;
}

.time{
font-size:50px;
font-weight:bold;
color:black;
}

.duration{
font-size:28px;
color:gray;
}

.price{
font-size:45px;
font-weight:bold;
color:#071633;
}

.seats-left{
font-size:28px;
color:#18c37e;
font-weight:bold;
margin-bottom:25px;
}

.select-btn{
background:linear-gradient(90deg,#1fa2ff,#7b3ff2);
color:white;
border:none;
padding:18px 35px;
font-size:24px;
border-radius:15px;
cursor:pointer;
}

.select-btn:hover{
opacity:0.9;
}

/* RESPONSIVE */

@media(max-width:768px){

.logo{
font-size:28px;
}

.route-box h1{
font-size:32px;
}

.route-box h2{
font-size:24px;
}

.bus-name{
font-size:28px;
}

.bus-type{
font-size:20px;
}

.time{
font-size:32px;
}

.price{
font-size:30px;
}

.select-btn{
width:100%;
}

}

/* Mobile Responsive */

@media screen and (max-width: 768px){

body{
padding:10px;
}

.navbar{
padding:15px;
flex-direction:column;
gap:10px;
}

.logo{
font-size:24px;
text-align:center;
}

.route-box,
.ticket,
.payment-box,
.info{
width:100%;
padding:20px;
}

h1{
font-size:28px;
}

h2{
font-size:22px;
}

button{
width:100%;
font-size:16px;
}

input,
select{
width:100%;
}

}

/* Small Phones */

@media screen and (max-width:480px){

h1{
font-size:22px;
}

.logo{
font-size:20px;
}

button{
padding:12px;
}

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">
Sri Saradha Transports
</div>

<a href="index.html" class="back-btn">
← Back
</a>

</div>

<!-- ROUTE -->

<div class="route-box">

<h1>
Coimbatore → Madurai
</h1>

<h2>
30 May 2026
</h2>

</div>

<!-- BUS LIST -->

<div class="bus-container" id="busContainer">
</div>

 

 
 <script>

if(!localStorage.getItem("email")){
    alert("Please Login First");
    window.location.href = "login.html";
}

let buses =
JSON.parse(localStorage.getItem("buses")) || [];

if(buses.length === 0){

buses = [

{
name:"Saradha Volvo Multi Axle",
model:"Volvo Multi Axle",
price:1899,
seats:12
},

{
name:"Saradha Scania Luxury",
model:"Scania Luxury",
price:2099,
seats:8
},

{
name:"Saradha BharatBenz Coach",
model:"BharatBenz Coach",
price:1599,
seats:15
},

{
name:"Saradha Mercedes-Benz",
model:"Mercedes-Benz",
price:2299,
seats:5
}

];

}

let container =
document.getElementById("busContainer");

buses.forEach(bus => {

container.innerHTML += `

<div class="bus-card">

<div class="bus-name">
${bus.name}
</div>

<div class="bus-type">
${bus.model}
</div>

<div class="rating">
4.8 ★
</div>

<div class="time-row">

<div>
<div class="time">
09:30 PM
</div>

<div class="duration">
7h 00m
</div>
</div>

<div class="price">
₹${bus.price}
</div>

<div>
<div class="time">
05:30 AM
</div>
</div>

</div>

<div class="seats-left">
${bus.capacity || bus.seats || 30} Seats Left
</div>

<button
class="select-btn"
onclick="selectBus('${bus.name}',${bus.price})">

Select Seats

</button>

</div>

`;

});

function selectBus(busName,price){

localStorage.setItem("bus",busName);

localStorage.setItem("amount",price);

window.location.href="seats.html";

}

</script>

</body>
