<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#071633,#5a5adb);
}

.login-box{
background:white;
padding:40px;
width:350px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
}

.login-box h1{
color:#5a5adb;
margin-bottom:25px;
}

.login-box input{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
outline:none;
}

.login-box input:focus{
border-color:#5a5adb;
}

.login-btn{
width:100%;
padding:14px;
border:none;
background:#5a5adb;
color:white;
font-size:16px;
border-radius:10px;
cursor:pointer;
}

.login-btn:hover{
background:#4747c9;
}

.back-btn{
display:block;
margin-top:15px;
text-decoration:none;
color:#5a5adb;
font-weight:bold;
}

.error{
color:red;
margin-top:10px;
display:none;
}
/* Mobile Responsive */

@media screen and (max-width: 768px){

body{
padding:10px;
}

.navbar{
padding:15px;
flex-direction:column;
gap:10px;
}

.logo{
font-size:24px;
text-align:center;
}

.route-box,
.ticket,
.payment-box,
.info{
width:100%;
padding:20px;
}

h1{
font-size:28px;
}

h2{
font-size:22px;
}

button{
width:100%;
font-size:16px;
}

input,
select{
width:100%;
}

}

/* Small Phones */

@media screen and (max-width:480px){

h1{
font-size:22px;
}

.logo{
font-size:20px;
}

button{
padding:12px;
}

}

@media(max-width:768px){

.login-box{
width:95%;
padding:20px;
}

button{
width:100%;
}

}

</style>

</head>

<body>

<div class="login-box">

<h1>🔐 Admin Login</h1>

<input
type="text"
id="username"
placeholder="Enter Username">

<input
type="password"
id="password"
placeholder="Enter Password">

<button
class="login-btn"
onclick="login()">
Login
</button>

<p id="error" class="error">
Invalid Username or Password
</p>

<a href="index.html" class="back-btn">
← Back to Home
</a>

</div>

<script>

function login(){

let username =
document.getElementById("username").value.trim();

let password =
document.getElementById("password").value.trim();

if(
username === "admin" &&
password === "12345"
){

 localStorage.setItem(
"adminLoggedIn",
"true"
);

window.location.href =
"admin.html";

}else{

document.getElementById("error").style.display =
"block";

}

}

</script>

</body>
</html>
